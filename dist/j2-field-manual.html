<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- build:strip-above -->
<title>J2 Prep Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: calm study desk. One reading column, a quiet side menu, and every lesson built from the same labelled blocks in the same order. */
:root {
  --bg: #f1f4f3;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #16211f;
  --ink-2: #34423f;
  --muted: #5f6d69;
  --line: #d5dedb;
  --accent: #0b6b66;
  --accent-ink: #ffffff;
  --accent-soft: #dcefec;
  --info: #2d5b8a;
  --info-soft: #e1ebf5;
  --warm: #8a5a12;
  --warm-soft: #f8eedb;
  --good: #1d7443;
  --good-soft: #dcf1e4;
  --warn: #8f5d00;
  --warn-soft: #fbefd2;
  --bad: #a8321f;
  --bad-soft: #fbe3de;
  --shadow: 0 1px 2px rgba(22, 33, 31, .06), 0 6px 20px rgba(22, 33, 31, .05);

  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;

  --step--1: .875rem;
  --step-0: 1.0625rem;
  --step-1: 1.1875rem;
  --step-2: 1.4375rem;
  --step-3: 1.875rem;
  --step-4: 2.375rem;
  --radius: 8px;
  --side-w: 250px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1413; --surface: #151d1c; --surface-2: #1b2524; --ink: #e3ebe9; --ink-2: #bccac6; --muted: #8c9c98; --line: #2a3634;
    --accent: #5cc2ba; --accent-ink: #062623; --accent-soft: #143633; --info: #8db8e3; --info-soft: #172a3d; --warm: #e8b566; --warm-soft: #33270f;
    --good: #5cc592; --good-soft: #12301f; --warn: #e6b04c; --warn-soft: #34290f; --bad: #f08a7a; --bad-soft: #3a1914;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1413; --surface: #151d1c; --surface-2: #1b2524; --ink: #e3ebe9; --ink-2: #bccac6; --muted: #8c9c98; --line: #2a3634;
  --accent: #5cc2ba; --accent-ink: #062623; --accent-soft: #143633; --info: #8db8e3; --info-soft: #172a3d; --warm: #e8b566; --warm-soft: #33270f;
  --good: #5cc592; --good-soft: #12301f; --warn: #e6b04c; --warn-soft: #34290f; --bad: #f08a7a; --bad-soft: #3a1914;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--step-0)/1.7 var(--font-body); }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
img { max-width: 100%; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
strong { font-weight: 700; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.topbar { display: none; }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  background: var(--surface); border-right: 1px solid var(--line);
  padding: 20px 14px 28px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { font: 800 .9rem/1 var(--font-display); background: var(--accent); color: var(--accent-ink); padding: 7px 7px 6px; border-radius: 5px; }
.brand-name { font: 700 1.125rem/1.1 var(--font-display); font-stretch: 90%; }
.side-progress { display: flex; flex-direction: column; gap: 6px; font-size: var(--step--1); color: var(--muted); padding: 0 6px; }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font: 500 .6875rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.nav-group a { display: flex; justify-content: space-between; align-items: center; color: var(--ink-2); text-decoration: none; padding: 8px 10px; border-radius: var(--radius); }
.nav-group a:hover { background: var(--surface-2); color: var(--ink); }
.nav-group a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.nav-count { font: 500 .75rem/1 var(--font-mono); background: var(--warm-soft); color: var(--warm); padding: 3px 7px; border-radius: 999px; }
.nav-count:empty { display: none; }
.side-search input { width: 100%; font: inherit; font-size: var(--step--1); color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; }
.side-size { display: flex; flex-direction: column; gap: 8px; padding: 0 6px; }
.side-size .seg button { padding: 6px 8px; }
.side-note { margin: auto 0 0; padding: 0 6px; font-size: .75rem; line-height: 1.5; color: var(--muted); }

.main { min-width: 0; padding-inline: clamp(16px, 4vw, 48px); padding-block: 36px 96px; outline: none; }
.page { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.page.wide { max-width: 1040px; }

/* Mobile, and focus mode on desktop: menu becomes an overlay behind a top bar. */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .topbar { display: flex; }
  .brand-side { display: none; }
  .sidebar { display: none; position: fixed; z-index: 30; inset: 0; height: 100%; width: 100%; padding-top: calc(70px + env(safe-area-inset-top, 0px)); border-right: 0; }
  .sidebar.open { display: flex; }
  .main { padding-block: 24px 80px; }
}
.shell.focus { grid-template-columns: minmax(0, 1fr); }
.shell.focus .topbar { display: flex; }
.shell.focus .brand-side { display: none; }
.shell.focus .sidebar { display: none; position: fixed; z-index: 30; inset: 0; height: 100%; width: min(320px, 100%); padding-top: calc(70px + env(safe-area-inset-top, 0px)); box-shadow: var(--shadow); }
.shell.focus .sidebar.open { display: flex; }
.topbar { align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; }

/* ---------- type ---------- */
.head { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font: 500 .75rem/1.3 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--ink); letter-spacing: -.005em; }
h1 { font-size: var(--step-4); line-height: 1.12; font-weight: 750; font-stretch: 88%; }
h2 { font-size: var(--step-3); line-height: 1.15; font-weight: 700; font-stretch: 90%; }
h3 { font-size: var(--step-1); line-height: 1.3; font-weight: 700; }
h4 { font-size: var(--step-0); line-height: 1.35; font-weight: 700; }
.lede { font-size: var(--step-1); color: var(--ink-2); margin: 0; max-width: 62ch; }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }

/* ---------- buttons, chips, bars ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; text-decoration: none;
  font: 700 var(--step-0)/1 var(--font-body); padding: 12px 18px; border-radius: var(--radius);
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); min-height: 48px;
}
.btn:hover { filter: brightness(1.07); }
.btn.big { font-size: var(--step-1); padding: 14px 24px; min-height: 56px; }
.btn.quiet { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.small-btn { min-height: 38px; padding: 7px 12px; font-size: var(--step--1); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.icon-btn { font: 500 .8125rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; cursor: pointer; }
.kbd { font: 500 .6875rem/1 var(--font-mono); border: 1px solid currentColor; border-radius: 4px; padding: 3px 5px; opacity: .7; }

.chip { display: inline-flex; align-items: center; font: 500 .75rem/1 var(--font-mono); padding: 5px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
.chip.done { color: var(--good); background: var(--good-soft); border-color: transparent; }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.chip.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
.chip.bad { color: var(--bad); background: var(--bad-soft); border-color: transparent; }

.bar { height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.mod-num { display: inline-grid; place-items: center; width: 1.7em; height: 1.7em; margin-right: 10px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .85em; }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.tile:hover { border-color: var(--accent); }
.tile p { margin: 0; color: var(--ink-2); font-size: var(--step--1); }

/* ---------- home ---------- */
.next { background: var(--accent-soft); border: 2px solid var(--accent); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.next p { margin: 0; color: var(--ink-2); }
.next-label { font: 500 .75rem/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.block { border-top: 1px solid var(--line); padding-top: 10px; }
.block:first-of-type { border-top: 0; padding-top: 0; }
.block > summary { display: flex; align-items: center; gap: 12px; cursor: pointer; list-style: none; padding: 6px 0; }
.block > summary::-webkit-details-marker { display: none; }
.block > summary::before { content: "+"; font: 700 1rem/1 var(--font-mono); color: var(--muted); width: 14px; }
.block[open] > summary::before { content: "−"; }
.block-name { font-weight: 700; }
.block-meta { color: var(--muted); font-size: var(--step--1); margin-right: auto; }
.break-note { margin: 8px 0 4px 26px; font-size: var(--step--1); color: var(--warm); }

/* step rows (used everywhere) */
.steps { display: flex; flex-direction: column; gap: 6px; }
.block .steps { margin: 8px 0 0 26px; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--ink); text-decoration: none; }
a.step:hover { border-color: var(--accent); }
.step.is-now { border: 2px solid var(--accent); background: var(--accent-soft); }
.tick { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); font-size: .8rem; font-weight: 700; }
.step.is-done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.step.is-wrong .tick { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.step-main { display: flex; flex-direction: column; min-width: 0; }
.step-kind { font-size: .75rem; color: var(--muted); }
.step-title { font-weight: 700; line-height: 1.35; }
.step.is-done .step-title { color: var(--ink-2); font-weight: 400; }
.step-mins { font: 500 .75rem/1 var(--font-mono); color: var(--muted); white-space: nowrap; }

/* ---------- lesson blocks: same order, same look, every time ---------- */
.lesson-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.dots { display: inline-flex; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 2px var(--accent-soft); }

.blk { border-radius: 10px; padding: 16px 20px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.blk > p { margin: 0; }
.blk-label { font: 500 .75rem/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.blk-tldr { background: var(--accent-soft); border: 2px solid var(--accent); }
.blk-tldr p { font-size: var(--step-2); line-height: 1.45; font-weight: 700; font-family: var(--font-body); }
.blk-tldr .blk-label { color: var(--accent); }
.blk-why { background: transparent; border-style: dashed; }
.blk-points ol { margin: 0; padding-left: 1.4rem; display: flex; flex-direction: column; gap: 10px; }
.blk-points li::marker { font-weight: 700; color: var(--accent); }
.blk-extra { background: transparent; border: 0; padding: 0; gap: 12px; }
.blk-extra p { margin: 0; }
.blk-j2 { background: var(--info-soft); border-color: transparent; border-left: 4px solid var(--info); }
.blk-j2 .blk-label { color: var(--info); }
.blk-words { background: var(--surface-2); }
.blk-words dl, dl.words { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.blk-words dt, dl.words dt { font-weight: 700; display: inline; }
.blk-words dt::after, dl.words dt::after { content: ": "; }
.blk-words dd, dl.words dd { display: inline; margin: 0; color: var(--ink-2); }
dl.words > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.blk-say { background: var(--warm-soft); border-color: transparent; border-left: 4px solid var(--warm); }
.blk-say .blk-label { color: var(--warm); }
.blk-say p { font-style: italic; font-size: var(--step-1); }
.blk-verify { background: var(--warn-soft); border-color: transparent; border-left: 4px solid var(--warn); }
.blk-verify .blk-label { color: var(--warn); }
.blk-check { border: 2px solid var(--line); }
.q-text { font-weight: 700; font-size: var(--step-1); margin: 0; }
.q-h { font-size: var(--step-3); line-height: 1.25; font-stretch: 95%; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; font: inherit; color: var(--ink); background: var(--surface-2); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px 14px; cursor: pointer; min-height: 48px; }
.big-opts .opt { padding: 16px 18px; font-size: var(--step-1); }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt[disabled] { cursor: default; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.correct::before { content: "✓ "; color: var(--good); font-weight: 700; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.feedback { margin: 0; padding: 12px 14px; border-radius: var(--radius); }
.feedback.good { background: var(--good-soft); }
.feedback.bad { background: var(--bad-soft); }

.lesson-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 20px; }

/* ---------- tables & flows ---------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); max-width: 100%; }
table { border-collapse: collapse; width: 100%; font-size: var(--step--1); line-height: 1.55; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 500 .6875rem/1.3 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: var(--step--1); }
.flow-step { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; }
.flow-arrow { color: var(--muted); }

/* ---------- cheat sheet ---------- */
.plain-list { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 8px; }
.area-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.area-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.area-num { font: 800 1.5rem/1 var(--font-display); color: var(--accent); }
.area-risk { margin: 0; font-weight: 700; font-size: var(--step--1); }
.area-quote { margin: 0; font-style: italic; color: var(--muted); font-size: var(--step--1); }
.area-card ul { margin: 4px 0 0; padding-left: 1.1rem; font-size: var(--step--1); display: flex; flex-direction: column; gap: 4px; }
.pitch { margin: 0; padding: 16px 20px; background: var(--warm-soft); border-left: 4px solid var(--warm); border-radius: var(--radius); font-size: var(--step-1); line-height: 1.6; }

/* ---------- flashcards ---------- */
.flash { min-height: 230px; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 28px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.flash .term { font: 750 clamp(1.75rem, 5vw, 2.5rem)/1.1 var(--font-display); font-stretch: 90%; }
.flash .def { font-size: var(--step-1); color: var(--ink-2); }
.empty { border: 2px dashed var(--line); border-radius: 12px; padding: 28px; text-align: center; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; }
.empty h3, .empty p { margin: 0; }

/* ---------- forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field-label { font-weight: 700; font-size: var(--step--1); }
.hint { font-size: .8125rem; color: var(--muted); }
input[type="text"], input[type="search"], textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; width: 100%; }
textarea { min-height: 110px; resize: vertical; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; align-self: flex-start; }
.seg button { font: inherit; font-size: var(--step--1); padding: 9px 12px; border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; min-height: 40px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.checklist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.check { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; background: var(--surface); }
.check:last-child { border-bottom: 0; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
.check.is-done span { color: var(--muted); text-decoration: line-through; }

/* scorecard */
.sc-q { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: center; }
.sc-q:last-child { border-bottom: 0; }
@media (max-width: 640px) { .sc-q { grid-template-columns: minmax(0, 1fr); } }
.area-bars { display: flex; flex-direction: column; gap: 12px; }
.area-bar { display: grid; grid-template-columns: 84px minmax(0, 1fr) 48px; gap: 12px; align-items: center; font-size: var(--step--1); }
.area-bar .track { height: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.area-bar .fill { display: block; height: 100%; background: var(--accent); border-radius: 0 4px 4px 0; }
.area-bar .val { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: var(--radius); z-index: 50; box-shadow: var(--shadow); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<!-- build:head-end -->
</head>

window.H = (function () {
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  return {
    esc: esc,
    flow: function (steps) {
      return '<div class="flow" role="list">' + steps.map(function (s) {
        return '<span class="flow-step" role="listitem">' + s + '</span>';
      }).join('<span class="flow-arrow" aria-hidden="true">→</span>') + '</div>';
    },
    table: function (head, rows) {
      return '<div class="table-wrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + h + '</th>'; }).join('') +
        '</tr></thead><tbody>' + rows.map(function (r) {
          return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
  };
})();

COURSE.modules.push({
  id: 'm2', title: 'Cyber security basics', short: 'What gets attacked, who attacks, and how. Plain language, no jargon without a meaning.',
  lessons: [
    {
      id: 'l1', title: 'What cyber security protects', mins: 6,
      tldr: 'Cyber security keeps information private, correct, and available when people need it.',
      why: 'Every security product exists to protect one or more of these three things. It is the base idea everything else builds on.',
      points: [
        '<strong>Confidentiality (private):</strong> only the right people can see it. Broken by: a data leak, a stolen password.',
        '<strong>Integrity (correct):</strong> nobody changes it without permission. Broken by: a criminal changing the bank details on an invoice.',
        '<strong>Availability (there when needed):</strong> broken by ransomware locking files, or systems going down.',
        'Security people call these three the <strong>CIA triad</strong>. It has nothing to do with the American spy agency.',
        'For a business, what is really at stake: money, customer trust, legal fines, and being able to work at all.'
      ],
      j2: 'J2\'s data page lists the costs of a breach: losing customers and reputation, expensive regulatory fines, operational downtime, and the human toll (stress and mental health of staff and leaders).',
      say: 'Security keeps information private, correct and available. Without those, the business can\'t operate.',
      words: [['Breach', 'When an attacker gets in, or data gets out.'], ['Data', 'Any business information: contracts, customer details, prices, plans.']],
      check: { q: 'A criminal changes the bank account number on an invoice. Which property is broken?', options: ['Confidentiality', 'Integrity', 'Availability'], answer: 1, why: 'The information was changed without permission, so its integrity is broken.' }
    },
    {
      id: 'l2', title: 'Who attacks, and why', mins: 6,
      tldr: 'Most attacks are done by criminal groups who want money. Some risk comes from people inside the company.',
      why: 'Knowing the attacker explains why J2 sells what it sells.',
      points: [
        '<strong>Criminal gangs:</strong> they run like businesses. They steal data, lock systems and demand payment. This is the main threat to J2\'s customers.',
        '<strong>Fraudsters:</strong> they trick staff into paying fake invoices or changing bank details.',
        '<strong>Insiders:</strong> staff who make mistakes (negligent), or who steal on purpose (malicious). Example: taking the client list before resigning.',
        '<strong>Nation-state hackers:</strong> governments spying on each other. Big in the news, less common for typical businesses.',
        'Attackers take the easiest way in. That is usually a person, not a clever technical trick.'
      ],
      say: 'Most attackers are after money, and they go for the easiest target. Usually that\'s a person.',
      words: [['Threat actor', 'Whoever is attacking.'], ['Insider threat', 'Risk that comes from someone inside the organisation, on purpose or by accident.']],
      check: { q: 'What do most attackers of normal businesses want?', options: ['Fame', 'Money', 'To test their skills'], answer: 1, why: 'Most attacks are financially motivated crime.' }
    },
    {
      id: 'l3', title: 'How attacks start: people', mins: 7,
      tldr: 'Almost every successful attack needs a person to click, type or share something they should not.',
      why: 'This is J2\'s first area (Users) and the reason email security matters so much.',
      points: [
        '<strong>Phishing:</strong> a fake email or message that tricks you into clicking a link, opening a file, or typing your password.',
        '<strong>Credential theft:</strong> the fake login page steals your username and password.',
        '<strong>Social engineering:</strong> pressuring people with urgency, fear or authority. For example: "This is the CEO. Pay this supplier now."',
        '<strong>Mistakes:</strong> uploading sensitive files to the wrong place, or emailing the wrong person.',
        'J2\'s numbers: <em>"80% of breaches happen because of the actions of just 8% of users."</em>'
      ],
      j2: 'J2\'s view: people are often called the "weakest link". With training and the right controls, J2 aims to make them <em>"the strongest line of defence."</em>',
      say: 'Most attacks start with a person being tricked. J2 works to turn users from the weakest link into the strongest defence.',
      words: [['Phishing', 'Fake messages designed to trick people.'], ['Credentials', 'Username plus password.'], ['Social engineering', 'Manipulating people instead of hacking computers.']],
      check: { q: 'J2 says 80% of breaches are caused by what share of users?', options: ['8%', '50%', '80%'], answer: 0, why: 'A small group of risky users causes most breaches. Visibility shows you who they are.' }
    },
    {
      id: 'l4', title: 'Ransomware and data theft', mins: 7,
      tldr: 'Ransomware locks a company\'s files and demands payment. Modern gangs also steal the data first and threaten to publish it.',
      why: 'Ransomware is the attack business owners fear most. Much of what J2 sells is about stopping it or recovering from it.',
      points: [
        'The usual path: get in (often by phishing) → move around quietly → steal data → lock (encrypt) files → demand a ransom.',
        '<strong>Double extortion:</strong> "Pay us, or your files stay locked <em>and</em> we publish your data."',
        'The damage: the business stops, recovery costs money, fines can follow, and customers lose trust.',
        'Best defences: block the way in, catch attackers early while they move around (24/7 monitoring), and keep backups the attackers cannot delete.',
        'Paying the ransom is no guarantee of getting data back.'
      ],
      extra: H.flow(['Phishing email', 'Attacker gets in', 'Moves around quietly', 'Steals data', 'Locks files', 'Ransom demand']),
      j2: 'J2 covers each step: email security for the way in, MDR on machines to catch and contain attackers 24/7, and backup and restoration so data can come back.',
      say: 'With ransomware, speed and backups decide the outcome. Catch the attacker before they lock files, or restore quickly, and you stay in business.',
      words: [['Ransomware', 'Malware that locks files until a ransom is paid.'], ['Encrypt', 'Scramble data so it cannot be read without a key.'], ['Downtime', 'Time when the business cannot work.']],
      check: { q: 'What is "double extortion"?', options: ['Asking for the ransom twice', 'Locking files and also threatening to publish stolen data', 'Attacking two companies at once'], answer: 1, why: 'Gangs steal data first, so backups alone do not remove the threat.' }
    },
    {
      id: 'l5', title: 'Accounts: passwords, MFA and takeover', mins: 7,
      tldr: 'Attackers now often log in instead of breaking in. Protecting user accounts is one of the most important jobs in security.',
      why: 'Account takeover in Microsoft 365 is a headline J2 service. You will hear about it often.',
      points: [
        'People work from home, cafés and anywhere else. The "wall around the office" is gone. J2: <em>"Your perimeter is wherever your user is."</em>',
        '<strong>Account takeover:</strong> an attacker gets someone\'s login and uses their real account, often their Microsoft 365 email.',
        '<strong>MFA (multi-factor authentication):</strong> a second check as well as the password, such as a code or an app prompt. It stops most password-only attacks.',
        '<strong>Password management:</strong> strong, different passwords for each account, stored in a password manager.',
        'Warning signs of a taken-over account: logins from strange countries, new email rules that hide messages, many emails suddenly sent.'
      ],
      j2: 'J2 sells MFA and password management (Users area), and <strong>J2 Advanced Microsoft 365 Security Monitoring</strong> to stop account takeover (Email area).',
      say: 'Attackers log in rather than break in. MFA and 24/7 monitoring of Microsoft 365 stop account takeover.',
      words: [['Perimeter', 'The edge of the network you protect. It used to be the office walls.'], ['MFA', 'A second proof that it\'s really you, as well as the password.'], ['Microsoft 365', 'Microsoft\'s cloud email and office apps: Outlook, Teams, OneDrive, SharePoint.']],
      check: { q: 'What does MFA add?', options: ['A longer password', 'A second proof of identity as well as the password', 'Faster internet'], answer: 1, why: 'Even if the password is stolen, the second factor blocks most logins.' }
    },
    {
      id: 'l6', title: 'Layers and zero trust', mins: 7,
      tldr: 'No single tool is enough. Good security stacks several layers and never trusts any person or device automatically.',
      why: 'This explains why J2 sells many services across five areas instead of one product.',
      points: [
        '<strong>Defence in depth:</strong> several layers, like a house with a locked gate, a locked door, an alarm and a safe.',
        'The layers do three jobs: <strong>prevent</strong> (block), <strong>detect</strong> (notice) and <strong>respond</strong> (act and recover).',
        '<strong>Zero trust:</strong> "never trust, always verify". Every user and device proves who it is every time, even inside the office network.',
        '<strong>Least privilege:</strong> people only get the access they actually need for their job.',
        'Security should not stop people working. J2: <em>"You shouldn\'t have to choose between security and productivity."</em>'
      ],
      extra: H.table(['Job', 'Example']
        , [['Prevent', 'Email filtering, MFA, patching, blocking bad websites'], ['Detect', '24/7 SOC monitoring, user activity monitoring, honeypots'], ['Respond', 'Isolating a laptop, locking an account, restoring from backup']]),
      j2: 'J2 offers <strong>Zero-Trust Network and Internet Access</strong> in its Internet area.',
      say: 'Good security is layered. Prevent what you can, detect what gets through, and respond fast. Zero trust means every access gets checked.',
      words: [['Defence in depth', 'Several independent layers of protection.'], ['Zero trust', 'Never trust automatically; always verify.'], ['Least privilege', 'Only the access someone needs, nothing more.']],
      check: { q: 'What does zero trust mean?', options: ['Trust everyone inside the office', 'Never trust automatically; always verify every user and device', 'Don\'t trust any vendors'], answer: 1, why: 'Location is not proof of trust. Every access is checked.' }
    }
  ],
  quiz: [
    { q: 'Ransomware locking files mainly breaks which property?', options: ['Availability', 'Integrity', 'Confidentiality', 'None'], answer: 0, why: 'Locked files are not available. With double extortion, confidentiality is hit too.' },
    { q: 'An email says "This is the CEO, pay this supplier in the next hour, keep it quiet." This is…', options: ['A normal request', 'Social engineering using urgency and authority', 'A software bug', 'A backup alert'], answer: 1, why: 'Urgency plus authority plus secrecy is a classic fraud pattern (CEO impersonation).' },
    { q: 'Which is the best defence against ransomware if everything else fails?', options: ['Paying quickly', 'Backups that attackers cannot delete, plus a tested restore', 'Turning off the internet forever', 'A longer password'], answer: 1, why: 'Protected backups let the business recover without paying.' },
    { q: 'Which is a warning sign of account takeover?', options: ['A user changing their desktop background', 'A login from an unusual country, then a new rule hiding emails', 'A printer running out of paper', 'A software update'], answer: 1, why: 'Strange logins and hidden-email rules are classic takeover signs.' },
    { q: '"Defence in depth" means…', options: ['One very strong firewall', 'Several layers of protection that back each other up', 'Hiding servers underground', 'Only protecting the CEO'], answer: 1, why: 'If one layer fails, another catches the attack.' }
  ]
});
})(window.H);
</script>

COURSE.modules.push({
  id: 'm3', title: 'What an MSSP does', short: 'The business model: why companies outsource security, how the SOC works, and how money comes in.',
  lessons: [
    {
      id: 'l1', title: 'MSP, MSSP, MDR: the difference', mins: 6,
      tldr: 'An MSP runs a company\'s IT. An MSSP runs its security. MDR is the part where the provider actively finds and stops attacks.',
      why: 'These letters are used all the time, and they are easy to mix up.',
      points: [
        'Hiring a full in-house security team is expensive, and skilled people are hard to find.',
        'Attacks happen 24/7. Covering nights, weekends and holidays needs many people working in shifts.',
        'An MSSP shares one expert team across many clients. That makes 24/7 protection affordable for each of them.',
        'J2 is an <strong>MSSP</strong> that also provides <strong>MDR</strong>. Its website has a "J2 MDR Service" page.'
      ],
      extra: H.table(['Type', 'What they do', 'Customer says'], [
        ['MSP', 'Runs IT: laptops, help desk, networks, Microsoft 365 setup', '"Keep our IT working."'],
        ['MSSP', 'Runs security tools and watches them as a service', '"Keep us secure and compliant."'],
        ['MDR', 'Detects attacks and responds hands-on: contains, isolates, removes', '"Stop attackers for us, day and night."']
      ]),
      say: 'Most companies can\'t afford their own 24/7 security team. An MSSP like J2 gives them one, shared across many clients.',
      words: [['Outsource', 'Pay another company to do a job for you.'], ['MDR', 'Managed Detection and Response: find attacks and act on them.']],
      check: { q: 'Why do companies use an MSSP?', options: ['It is the law', 'A 24/7 in-house security team is expensive and hard to hire', 'To get cheaper laptops'], answer: 1, why: 'Sharing an expert team across clients makes 24/7 coverage affordable.' }
    },
    {
      id: 'l2', title: 'The SOC: the 24/7 control room', mins: 8,
      tldr: 'The SOC is where analysts watch alerts from all clients, decide what is real, and act fast when something is wrong.',
      why: 'The SOC is the heart of J2. Most of what clients pay for runs through it.',
      points: [
        'Security tools send <strong>alerts</strong> (possible problems) into one central system.',
        'Analysts <strong>triage</strong> each alert: is it real or a false alarm, and how serious is it?',
        'If it is real, they <strong>contain</strong> it (for example, cut a laptop off the network or lock an account), tell the client, then clean up.',
        'Most alerts are false alarms. Too many false alarms causes <strong>alert fatigue</strong>, so good SOCs keep tuning their tools.',
        'J2\'s words for the job: <em>identify, isolate and remove</em> threats as they happen.'
      ],
      extra: H.flow(['Alert', 'Triage', 'Investigate', 'Contain', 'Tell the client', 'Fix and report']) +
        H.table(['Role', 'What they do'], [
          ['Tier 1 analyst', 'First look at alerts. Closes false alarms, escalates real ones.'],
          ['Tier 2 analyst / responder', 'Investigates real incidents and contains them.'],
          ['Tier 3 / threat hunter', 'Hunts for hidden attackers and handles the hardest cases.'],
          ['SOC manager', 'Runs shifts, quality and client escalations.']
        ]),
      j2: 'J2 says it uses <em>"attacker based detections"</em>: detection rules built around how real attackers behave, not just generic warnings.',
      say: 'The SOC identifies, isolates and removes threats as they happen, 24 hours a day.',
      words: [['Alert', 'An automatic warning that something might be wrong.'], ['Triage', 'Quickly deciding how serious something is.'], ['False positive', 'An alert that turns out to be nothing.'], ['Incident', 'A confirmed security problem that needs action.']],
      check: { q: 'What does "contain" mean in the SOC?', options: ['Write a report', 'Stop the threat from spreading, e.g. isolate a laptop', 'Buy a new tool'], answer: 1, why: 'Containment stops the damage growing while the problem is fixed.' }
    },
    {
      id: 'l3', title: 'How the business makes money', mins: 7,
      tldr: 'An MSSP earns steady monthly fees per user, device or service. It grows by winning clients and by existing clients adding more areas.',
      why: 'Knowing how money flows helps you understand priorities, targets and why clients are treated the way they are.',
      points: [
        '<strong>Recurring revenue:</strong> clients pay monthly or yearly (subscriptions), not once.',
        'Pricing is usually per user, per mailbox, per device, or per service bundle.',
        'Many services run on partner technology (for example Mimecast). J2 provides the licences <em>plus</em> the experts who run and watch them. The people are the real value.',
        '<strong>Growth</strong> comes from new clients, and from existing clients adding areas: start with email, then add machines, then data. This is called <strong>upselling</strong>.',
        '<strong>Keeping clients</strong> (retention) matters a lot. Good reports, fast response and trust keep them.',
        'The biggest cost is skilled people working 24/7.'
      ],

<script>
(function () {
'use strict';
var C = window.COURSE, H = window.H, esc = H.esc;
var KEY = 'j2-crash-course.v2';
var INTERVALS = [0, 1, 3, 7, 14, 30];
var BLOCK_MINS = 40;

/* ---------------- state ---------------- */
function defaults() {
  return { profile: { name: 'Jack' }, prefs: { size: 'm', focus: true }, done: {}, quiz: {}, checks: {}, cards: {}, sc: {}, asked: {} };
}
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw), out = Object.assign(defaults(), o);
      out.profile = Object.assign(defaults().profile, o.profile || {});
      out.prefs = Object.assign(defaults().prefs, o.prefs || {});
      return out;
    }
  } catch (e) { /* storage unavailable: run in memory */ }
  return defaults();
}
var S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } }

/* ---------------- dates ---------------- */
function pad(n) { return String(n).padStart(2, '0'); }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function today() { return iso(new Date()); }
function addDays(s, n) { var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]); d.setDate(d.getDate() + n); return iso(d); }

/* ---------------- course index: one ordered list of steps, grouped into ~40 min blocks ---------------- */
var LESSONS = [], STEPS = [];
C.modules.forEach(function (m, mi) {
  m.num = mi + 1;
  m.lessons.forEach(function (l, li) {
    l.key = m.id + '.' + l.id; l.module = m; l.pos = li + 1;
    LESSONS.push(l);
    STEPS.push({ type: 'lesson', key: l.key, title: l.title, mins: l.mins, href: '#' + l.key, module: m });
  });
  if (m.quiz.length) STEPS.push({ type: 'quiz', key: m.id + '.quiz', title: 'Quick quiz: ' + m.title, mins: Math.max(3, Math.round(m.quiz.length * 0.8)), href: '#' + m.id + '.quiz', module: m });
});
STEPS.push({ type: 'review', key: 'review.cheat', title: 'Read the cheat sheet', mins: 10, href: '#cheatsheet' });
STEPS.push({ type: 'review', key: 'review.cards', title: 'Flashcards: one round', mins: 15, href: '#cards' });

var BLOCKS = [];
(function () {
  var cur = { steps: [], mins: 0 };
  STEPS.forEach(function (s, i) {
    cur.steps.push(s); cur.mins += s.mins; s.index = i;
    var nextIsQuiz = STEPS[i + 1] && STEPS[i + 1].type === 'quiz';
    if (cur.mins >= BLOCK_MINS && !nextIsQuiz) { BLOCKS.push(cur); cur = { steps: [], mins: 0 }; }
  });
  if (cur.steps.length) BLOCKS.push(cur);
  BLOCKS.forEach(function (b, i) { b.num = i + 1; b.steps.forEach(function (s) { s.block = b; }); });
})();

function stepDone(s) { return s.type === 'quiz' ? !!S.quiz[s.key.split('.')[0]] : !!S.done[s.key]; }
function nextStep() { return STEPS.find(function (s) { return !stepDone(s); }); }
function minsLeft() { return STEPS.reduce(function (a, s) { return a + (stepDone(s) ? 0 : s.mins); }, 0); }
function totalMins() { return STEPS.reduce(function (a, s) { return a + s.mins; }, 0); }
function doneSteps() { return STEPS.filter(stepDone).length; }
function hm(mins) { var h = Math.floor(mins / 60), m = mins % 60; return ((h ? h + ' h ' : '') + (m || !h ? m + ' min' : '')).trim(); }
function mod(id) { return C.modules.find(function (m) { return m.id === id; }); }
function stepByKey(k) { return STEPS.find(function (s) { return s.key === k; }); }
function isDue(t) { var c = S.cards[t.id]; return !c || c.due <= today(); }
function dueCount() { return C.glossary.filter(isDue).length; }
function bar(pct, label) { return '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="' + (label || 'Progress') + '"><span style="width:' + pct + '%"></span></div>'; }
function strip(html) { return String(html).replace(/<[^>]+>/g, ' ').replace(/&[a-z#0-9]+;/gi, ' ').replace(/\s+/g, ' ').trim(); }

/* After finishing a step: go to the break screen if it closed a block, otherwise straight on. */
function afterStep(key) {
  var s = stepByKey(key);
  if (!s) return '#home';
  var b = s.block;
  if (s === b.steps[b.steps.length - 1] && b.steps.every(stepDone) && b.num < BLOCKS.length) return '#break';
  var n = STEPS.slice(s.index + 1).find(function (x) { return !stepDone(x); }) || nextStep();
  return n ? n.href : '#finished';
}

/* ---------------- transient view state ---------------- */
var quizState = { mid: null, i: 0, picks: [] };
var cardState = { filter: 'all', queue: null, revealed: false, ahead: false, reviewed: 0 };
var wordQ = '', searchQ = '', resetArmed = false, lastBreakBlock = 1;

/* ---------------- shared bits ---------------- */
function head(eyebrow, title, lede) {
  return '<header class="head"><div class="eyebrow">' + eyebrow + '</div><h1>' + title + '</h1>' + (lede ? '<p class="lede">' + lede + '</p>' : '') + '</header>';
}
function stepRow(s, current) {
  var done = stepDone(s);
  var kind = s.type === 'quiz' ? 'Quiz' : s.type === 'review' ? 'Review' : 'Lesson';
  return '<a class="step' + (done ? ' is-done' : '') + (current ? ' is-now' : '') + '" href="' + s.href + '">' +
    '<span class="tick" aria-hidden="true">' + (done ? '✓' : '') + '</span>' +
    '<span class="step-main"><span class="step-kind">' + kind + (s.module ? ' · ' + esc(s.module.title) : '') + '</span><span class="step-title">' + esc(s.title) + '</span></span>' +
    '<span class="step-mins">' + (done ? 'Done' : s.mins + ' min') + '</span></a>';
}

/* ---------------- views ---------------- */
function viewHome() {
  var n = nextStep(), done = doneSteps(), pct = Math.round(done / STEPS.length * 100), left = minsLeft();
  var hero = n
    ? '<section class="next"><span class="next-label">' + (done ? 'Next up' : 'Start here') + ' · Block ' + n.block.num + ' of ' + BLOCKS.length + '</span><h2>' + esc(n.title) + '</h2><p>' + n.mins + ' minutes.' + (n.module ? ' Part of "' + esc(n.module.title) + '".' : '') + '</p>' +
      '<a class="btn big" href="' + n.href + '">' + (done ? 'Continue' : 'Start') + ' →</a></section>'
    : '<section class="next"><span class="next-label">All done</span><h2>You finished the crash course.</h2><p>Skim the cheat sheet the morning you start. That is all you need.</p><a class="btn big" href="#cheatsheet">Open cheat sheet →</a></section>';

  var prog = '<section class="panel"><div class="panel-head"><h3>Your progress</h3><span class="chip accent">' + done + ' of ' + STEPS.length + ' steps</span></div>' + bar(pct) +
    '<p class="muted" style="margin:0">' + (left ? 'About <strong>' + hm(left) + '</strong> of study left, plus short breaks.' : 'Nothing left. Well done.') + '</p></section>';

  var plan = '<section class="panel"><div class="panel-head"><h3>The plan</h3><span class="muted small">' + BLOCKS.length + ' blocks · short break after each</span></div>' +
    BLOCKS.map(function (b) {
      var bDone = b.steps.every(stepDone), isNow = n && n.block === b;
      return '<details class="block"' + (isNow ? ' open' : '') + '><summary><span class="block-name">Block ' + b.num + '</span><span class="block-meta">' + b.mins + ' min · ' + b.steps.length + ' steps</span>' +
        (bDone ? '<span class="chip done">Done</span>' : isNow ? '<span class="chip accent">Now</span>' : '<span class="chip">Later</span>') + '</summary>' +
        '<div class="steps">' + b.steps.map(function (s) { return stepRow(s, n === s); }).join('') + '</div>' +
        (b.num < BLOCKS.length ? '<p class="break-note">Then: 5 to 10 minute break</p>' : '') + '</details>';
    }).join('') + '</section>';

  var tools = '<div class="grid-3">' +
    '<a class="tile" href="#cheatsheet"><h4>Cheat sheet</h4><p>Everything on one page. Read it the morning you start.</p></a>' +
    '<a class="tile" href="#cards"><h4>Flashcards</h4><p>' + dueCount() + ' cards ready. Five minutes at a time.</p></a>' +
    '<a class="tile" href="#questions"><h4>Day-one questions</h4><p>Smart questions to ask in your first week.</p></a></div>';

  return '<div class="page">' +
    head('<span>Crash course</span><span>About ' + hm(totalMins()) + ' in total</span>', 'Hi ' + esc(S.profile.name || 'there') + '. Let\'s get you ready for J2.', 'What J2 does, how the business works, and the cyber security basics behind it. Short lessons, one idea at a time. You can stop whenever you like; progress saves automatically.') +
    hero + prog + plan + tools + '</div>';
}

function viewCourse() {
  return '<div class="page">' + head('<span>All lessons</span><span>' + LESSONS.length + ' lessons · ' + C.modules.filter(function (m) { return m.quiz.length; }).length + ' quizzes</span>', 'Course map', 'Six modules, in order. Lessons take 5 to 9 minutes each.') +
    C.modules.map(function (m) {
      var steps = STEPS.filter(function (s) { return s.module === m; });
      var d = steps.filter(stepDone).length, mins = steps.reduce(function (a, s) { return a + s.mins; }, 0);
      return '<section class="panel"><div class="panel-head"><h3><span class="mod-num">' + m.num + '</span>' + esc(m.title) + '</h3><span class="chip' + (d === steps.length ? ' done' : '') + '">' + d + '/' + steps.length + ' · ' + mins + ' min</span></div>' +
        '<p class="muted" style="margin:0">' + esc(m.short) + '</p><div class="steps">' + steps.map(function (s) { return stepRow(s, false); }).join('') + '</div></section>';
    }).join('') + '</div>';
}

function viewLesson(l) {
  var m = l.module, done = S.done[l.key], picked = S.checks[l.key];
  var dots = m.lessons.map(function (x) { return '<span class="dot' + (S.done[x.key] ? ' done' : '') + (x === l ? ' now' : '') + '" aria-hidden="true"></span>'; }).join('');
  var check = '';
  if (l.check) {
    var answered = picked !== undefined;
    check = '<section class="blk blk-check"><span class="blk-label">Quick check</span><p class="q-text">' + esc(l.check.q) + '</p><div class="opts">' +
      l.check.options.map(function (o, j) {
        var cls = answered ? (j === l.check.answer ? ' correct' : (j === picked ? ' wrong' : '')) : '';
        return '<button type="button" class="opt' + cls + '" data-act="check" data-key="' + l.key + '" data-j="' + j + '"' + (answered ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('') + '</div>' +
      (answered ? '<p class="feedback ' + (picked === l.check.answer ? 'good' : 'bad') + '" role="status"><strong>' + (picked === l.check.answer ? 'Correct.' : 'Not quite.') + '</strong> ' + esc(l.check.why) + '</p>' : '') + '</section>';
  }
  var words = l.words && l.words.length ? '<section class="blk blk-words"><span class="blk-label">Words to know</span><dl>' + l.words.map(function (w) { return '<div><dt>' + esc(w[0]) + '</dt><dd>' + esc(w[1]) + '</dd></div>'; }).join('') + '</dl></section>' : '';
  var ttsBtn = ('speechSynthesis' in window) ? '<button type="button" class="btn quiet small-btn" data-act="speak" data-key="' + l.key + '">Read aloud</button>' : '';

  return '<article class="page lesson">' +
    '<div class="lesson-top"><span class="eyebrow"><span>Module ' + m.num + ': ' + esc(m.title) + '</span><span>Lesson ' + l.pos + ' of ' + m.lessons.length + '</span><span>' + l.mins + ' min</span></span>' +
    '<span class="dots">' + dots + '</span></div>' +
    '<h1>' + esc(l.title) + '</h1>' +
    '<div class="btn-row">' + ttsBtn + '<button type="button" class="btn quiet small-btn" data-act="focus" aria-pressed="' + !!S.prefs.focus + '">Focus mode: ' + (S.prefs.focus ? 'on' : 'off') + '</button></div>' +
    '<section class="blk blk-tldr"><span class="blk-label">In one sentence</span><p>' + esc(l.tldr) + '</p></section>' +
    '<section class="blk blk-why"><span class="blk-label">Why it matters</span><p>' + esc(l.why) + '</p></section>' +
    '<section class="blk blk-points"><span class="blk-label">Key points</span><ol>' + l.points.map(function (p) { return '<li>' + p + '</li>'; }).join('') + '</ol></section>' +
    (l.extra ? '<section class="blk blk-extra">' + l.extra + '</section>' : '') +
    (l.j2 ? '<section class="blk blk-j2"><span class="blk-label">At J2</span><p>' + l.j2 + '</p></section>' : '') +
    words +
    '<section class="blk blk-say"><span class="blk-label">Say it like this</span><p>"' + esc(l.say) + '"</p></section>' +
    check +
    '<footer class="lesson-foot">' +
    (done ? '<span class="chip done">Lesson done</span><a class="btn big" href="' + afterStep(l.key) + '">Next →</a>'
      : '<button class="btn big" type="button" data-act="complete" data-key="' + l.key + '">Done. Next →</button>') +
    '<a class="btn quiet" href="#home">Back to plan</a></footer></article>';
}

function viewQuiz(m) {
  if (quizState.mid !== m.id) quizState = { mid: m.id, i: 0, picks: [] };
  var qs = m.quiz, i = quizState.i;
  if (i >= qs.length) {
    var score = quizState.picks.reduce(function (a, p, k) { return a + (p === qs[k].answer ? 1 : 0); }, 0);
    var good = score / qs.length >= 0.8;
    return '<div class="page lesson">' + head('<span>Module ' + m.num + ': ' + esc(m.title) + '</span><span>Quiz finished</span>', score + ' out of ' + qs.length, good ? 'Great. You know this module.' : 'Good effort. The right answers are shown below. The key words are also in your flashcards.') +
      '<div class="steps">' + qs.map(function (q, k) {
        var ok = quizState.picks[k] === q.answer;
        return '<div class="step' + (ok ? ' is-done' : ' is-wrong') + '"><span class="tick" aria-hidden="true">' + (ok ? '✓' : '✗') + '</span><span class="step-main"><span class="step-title">' + esc(q.q) + '</span><span class="step-kind">Answer: ' + esc(q.options[q.answer]) + '</span></span></div>';
      }).join('') + '</div>' +
      '<div class="lesson-foot"><a class="btn big" href="' + afterStep(m.id + '.quiz') + '">Continue →</a><button class="btn quiet" type="button" data-act="quiz-restart">Try again</button></div></div>';
  }
  var q = qs[i], picked = quizState.picks[i], answered = picked !== undefined;
  return '<div class="page lesson">' +
    '<div class="lesson-top"><span class="eyebrow"><span>Quiz · Module ' + m.num + ': ' + esc(m.title) + '</span><span>Question ' + (i + 1) + ' of ' + qs.length + '</span></span>' +
    '<span class="dots">' + qs.map(function (_, k) { return '<span class="dot' + (k < i ? ' done' : '') + (k === i ? ' now' : '') + '" aria-hidden="true"></span>'; }).join('') + '</span></div>' +

/* ----- flashcards ----- */
function cardPool() { return C.glossary.filter(function (g) { return cardState.filter === 'all' || g.module === cardState.filter; }); }
function buildQueue() {
  var pool = cardPool(), due = cardState.ahead ? pool.slice() : pool.filter(isDue);
  due.sort(function (a, b) { var ba = (S.cards[a.id] || { box: 0 }).box, bb = (S.cards[b.id] || { box: 0 }).box; return ba - bb || a.term.localeCompare(b.term); });
  cardState.queue = due.map(function (g) { return g.id; });
  cardState.revealed = false;
}
function viewCards() {
  var pool = cardPool();
  var opts = '<option value="all">All words (' + C.glossary.length + ')</option>' + C.modules.filter(function (m) { return C.glossary.some(function (g) { return g.module === m.id; }); }).map(function (m) {
    return '<option value="' + m.id + '"' + (cardState.filter === m.id ? ' selected' : '') + '>Module ' + m.num + ': ' + esc(m.title) + '</option>';
  }).join('');
  var cur = cardState.queue.length ? C.glossary.find(function (g) { return g.id === cardState.queue[0]; }) : null;
  var known = pool.filter(function (g) { return (S.cards[g.id] || { box: 0 }).box > 0; }).length;
  var stage;
  if (cur) {
    stage = '<div class="flash" aria-live="polite"><span class="eyebrow"><span>' + cardState.queue.length + ' left in this round</span></span><div class="term">' + esc(cur.term) + '</div>' +
      (cardState.revealed ? '<div class="def">' + esc(cur.def) + '</div>' : '<div class="def muted">Say what it means, out loud or in your head. Then show the answer.</div>') + '</div>' +
      '<div class="btn-row">' + (cardState.revealed
        ? '<button class="btn quiet big" type="button" data-act="card-again">Not yet <span class="kbd">1</span></button><button class="btn big" type="button" data-act="card-good">Got it <span class="kbd">2</span></button>'
        : '<button class="btn big" type="button" data-act="card-reveal">Show answer <span class="kbd">Space</span></button>') + '</div>';
  } else {
    stage = '<div class="empty"><h3>Round finished</h3><p>' + (cardState.reviewed ? 'You went through ' + cardState.reviewed + ' cards. ' : '') + 'Cards you got right come back in a few days.</p><div class="btn-row" style="justify-content:center">' +

      '<button class="btn quiet" type="button" data-act="card-ahead">Go through them all again</button></div></div>';
  }
  return '<div class="page lesson">' + head('<span>Flashcards</span><span>' + known + ' of ' + pool.length + ' known</span>', 'Flashcards', 'One word at a time. "Got it" moves the card on. "Not yet" brings it back at the end of this round.') +
    '<div class="field" style="max-width:360px"><label for="cards-filter">Which words</label><select id="cards-filter" data-input="cards-filter">' + opts + '</select></div>' +
    bar(pool.length ? Math.round(known / pool.length * 100) : 0, 'Words known') + stage + '</div>';
}
function answerCard(good) {
  var id = cardState.queue.shift(), c = S.cards[id] || { box: 0 };
  if (good) { c.box = Math.min(5, c.box + 1); c.due = addDays(today(), INTERVALS[c.box]); }
  else { c.box = 0; c.due = today(); cardState.queue.push(id); }
  S.cards[id] = c; cardState.reviewed++; cardState.revealed = false;
  save(); render(true);
}

var SC_EXAMPLE = { u1: 2, u2: 1, u3: 0, u4: 0, e1: 2, e2: 0, e3: 1, e4: 1, d1: 1, d2: 2, d3: 0, d4: 1, m1: 1, m2: 2, m3: 1, m4: 1, i1: 0, i2: 1, i3: 0, i4: 0 };

function viewScorecard() {
  var own = Object.keys(S.sc).length > 0, ans = own ? S.sc : SC_EXAMPLE;
  var rows = C.scorecardAreas.map(function (a) {
    var qs = C.scorecard.filter(function (q) { return q.area === a.id; });
    var got = qs.reduce(function (s, q) { return s + (ans[q.id] || 0); }, 0);
    return { a: a, pct: Math.round(got / (qs.length * 3) * 100) };
  });
  var overall = Math.round(rows.reduce(function (s, r) { return s + r.pct; }, 0) / rows.length);
  var level = overall >= 70 ? ['done', 'Strong'] : overall >= 40 ? ['warn', 'Developing'] : ['bad', 'Exposed'];
  var plan = C.scorecard.filter(function (q) { return ans[q.id] !== undefined && ans[q.id] < 3; })
    .map(function (q) { return { q: q, p: q.w * (3 - ans[q.id]) }; }).sort(function (x, y) { return y.p - x.p; }).slice(0, 6);
  var answered = C.scorecard.filter(function (q) { return S.sc[q.id] !== undefined; }).length;

  var result = '<section class="panel"><div class="panel-head"><h3>Result by area</h3><span class="chip ' + level[0] + '">' + level[1] + ' · ' + overall + '%</span></div><div class="area-bars">' +
    rows.map(function (r) { return '<div class="area-bar"><span>' + esc(r.a.name) + '</span><span class="track"><span class="fill" style="width:' + r.pct + '%"></span></span><span class="val">' + r.pct + '%</span></div>'; }).join('') + '</div></section>';
  var planHtml = '<section class="panel"><h3>Action plan: fix these first</h3>' + (plan.length ? '<ol class="plain-list">' + plan.map(function (x) {
    return '<li>' + esc(x.q.action) + ' <span class="chip">' + esc(C.scorecardAreas.find(function (a) { return a.id === x.q.area; }).name) + '</span></li>';
  }).join('') + '</ol>' : '<p class="muted" style="margin:0">No gaps among the answered questions.</p>') + '</section>';
  var qs = C.scorecardAreas.map(function (a) {
    return '<section class="panel"><h3>' + esc(a.name) + '</h3>' + C.scorecard.filter(function (q) { return q.area === a.id; }).map(function (q) {
      return '<div class="sc-q"><span>' + esc(q.q) + '</span><span class="seg" role="group" aria-label="' + esc(q.q) + '">' + SC_LABELS.map(function (lab, v) {

      }).join('') + '</span></div>';
    }).join('') + '</section>';
  }).join('');
  return '<div class="page">' + head('<span>Bonus · about 10 min</span>', 'Practice scorecard', 'See how J2 starts a conversation with a new client: answer questions across the five areas, then read the action plan. Each fix names the J2 service that matches it.') +
    '<aside class="blk blk-verify"><span class="blk-label">Good to know</span><p>These 20 questions were written for this course. They follow J2\'s five areas, but they are not J2\'s real scorecard.</p></aside>' +
    (own ? '<div class="btn-row"><span class="chip accent">' + answered + ' of 20 answered</span><button class="btn quiet" type="button" data-act="sc-clear">Clear answers</button></div>'
      : '<aside class="blk blk-j2"><span class="blk-label">Example company</span><p>This shows a sample 150-person company. Answer any question below to start your own (try a company you know).</p></aside>') +
    result + planHtml + qs + '</div>';
}

/* ---------------- router ---------------- */
function route() {
  var h = decodeURIComponent((location.hash || '').replace(/^#/, '')) || 'home', m;
  if (h === 'home') return { nav: 'home', html: viewHome };
  if (h === 'course' || ((m = h.match(/^(m\d+)$/)) && mod(m[1]))) return { nav: 'course', html: viewCourse };
  if ((m = h.match(/^(m\d+)\.quiz$/)) && mod(m[1]) && mod(m[1]).quiz.length) { var qm = mod(m[1]); return { nav: 'course', focus: true, html: function () { return viewQuiz(qm); } }; }
  if ((m = h.match(/^(m\d+\.l\d+)$/))) { var l = LESSONS.find(function (x) { return x.key === m[1]; }); if (l) return { nav: 'course', focus: true, html: function () { return viewLesson(l); } }; }
  if (h === 'break') return { nav: 'home', html: viewBreak };
  if (h === 'finished') return { nav: 'home', html: viewFinished };
  if (h === 'cheatsheet') return { nav: 'cheatsheet', html: viewCheatsheet };
  if (h === 'cards') return { nav: 'cards', html: function () { if (lastHash !== location.hash || !cardState.queue) buildQueue(); return viewCards(); } };
  if (h === 'words') return { nav: 'words', html: viewWords, after: wordsUpdate };
  if (h === 'scorecard') return { nav: 'scorecard', html: viewScorecard };
  if (h === 'questions') return { nav: 'questions', html: viewQuestions };
  if (h === 'settings') return { nav: 'settings', html: viewSettings };
  if (h === 'search') return { nav: '', html: viewSearch };
  return { nav: 'home', html: viewHome };
}

function applyPrefs() {
  var sizes = { m: '100%', l: '112.5%', xl: '125%' };

  var y = window.scrollY, r = route();

  shell.classList.toggle('focus', !!(r.focus && S.prefs.focus));
  document.querySelectorAll('[data-nav]').forEach(function (a) {
    if (a.getAttribute('data-nav') === r.nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });

  document.getElementById('nav-progress').innerHTML = bar(Math.round(doneSteps() / STEPS.length * 100), 'Course progress') + '<span>' + doneSteps() + ' of ' + STEPS.length + ' steps · ' + hm(minsLeft()) + ' left</span>';

  if (sb.classList.contains('open') && !keepScroll) { sb.classList.remove('open'); document.getElementById('menu-btn').setAttribute('aria-expanded', 'false'); }
}

window.addEventListener('hashchange', function () { render(); });

/* ---------------- read aloud ---------------- */
function stopSpeaking() { try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) { /* ignore */ } }
function speakLesson(key, btn) {
  var l = LESSONS.find(function (x) { return x.key === key; });
  if (!l || !window.speechSynthesis) return;
  if (window.speechSynthesis.speaking) { stopSpeaking(); btn.textContent = 'Read aloud'; return; }
  var text = [l.title + '.', 'In one sentence. ' + l.tldr, 'Why it matters. ' + l.why, 'Key points.'].concat(l.points.map(strip)).concat(l.j2 ? ['At J2. ' + strip(l.j2)] : []).concat(['Say it like this. ' + l.say]).join(' ');
  try {
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95;
    u.onend = function () { btn.textContent = 'Read aloud'; };
    window.speechSynthesis.speak(u);
    btn.textContent = 'Stop reading';
  } catch (e) { toast('Read aloud is not available in this browser'); }
}

/* ---------------- interactions ---------------- */
function toast(msg) {
  document.querySelectorAll('.toast').forEach(function (x) { x.remove(); });
  var t = document.createElement('div');
  t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 2200);
}
function copyText(text, fallbackEl) {
  function fallback() {
    if (fallbackEl) { fallbackEl.value = text; fallbackEl.focus(); fallbackEl.select(); }
    toast('Select the text and copy it yourself');
  }
  try { navigator.clipboard.writeText(text).then(function () { toast('Copied'); }, fallback); } catch (e) { fallback(); }
}
function val(id) { var el = document.getElementById(id); return el ? el.value : ''; }
function finish(key) {
  var s = stepByKey(key);
  if (s && s.block) lastBreakBlock = s.block.num;
  return afterStep(key);
}

var actions = {
  'toggle-nav': function () {
    var sb = document.getElementById('sidebar'), open = !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    document.getElementById('menu-btn').setAttribute('aria-expanded', String(open));
  },
  'complete': function (t) { S.done[t.dataset.key] = Date.now(); save(); var to = finish(t.dataset.key); toast('Nice. Lesson done.'); go(to); },
  'check': function (t) { S.checks[t.dataset.key] = +t.dataset.j; save(); render(true); },
  'speak': function (t) { speakLesson(t.dataset.key, t); },
  'focus': function () { S.prefs.focus = !S.prefs.focus; save(); render(true); },
  'set-focus': function (t) { S.prefs.focus = t.dataset.v === '1'; save(); render(true); },
  'size': function (t) { S.prefs.size = t.dataset.v; save(); render(true); },
  'quiz-pick': function (t) {
    var m = mod(quizState.mid);
    quizState.picks[quizState.i] = +t.dataset.j;
    if (quizState.i === m.quiz.length - 1) {
      var score = quizState.picks.reduce(function (a, p, k) { return a + (p === m.quiz[k].answer ? 1 : 0); }, 0);
      var prev = S.quiz[m.id];
      S.quiz[m.id] = { best: Math.max(score, prev ? prev.best : 0), total: m.quiz.length };
      save();
    }
    render(true);
  },
  'quiz-next': function () {
    quizState.i++;
    if (quizState.i >= mod(quizState.mid).quiz.length) { var s = stepByKey(quizState.mid + '.quiz'); if (s) lastBreakBlock = s.block.num; }
    render(); window.scrollTo(0, 0);
  },
  'quiz-restart': function () { quizState = { mid: null, i: 0, picks: [] }; render(); },
  'review-done': function (t) { S.done[t.dataset.key] = Date.now(); save(); go(finish(t.dataset.key)); },
  'card-reveal': function () { cardState.revealed = true; render(true); },
  'card-good': function () { answerCard(true); },
  'card-again': function () { answerCard(false); },
  'card-ahead': function () { cardState.ahead = true; buildQueue(); render(true); },
  'sc-answer': function (t) { S.sc[t.dataset.q] = +t.dataset.v; save(); render(true); },
  'sc-clear': function () { S.sc = {}; save(); render(true); },
  'export': function () { copyText(JSON.stringify(S), document.getElementById('import-box')); },
  'import': function () {
    try {
      var o = JSON.parse(val('import-box'));
      if (!o || typeof o !== 'object' || !o.done) throw new Error('bad');
      S = Object.assign(defaults(), o);
      S.profile = Object.assign(defaults().profile, o.profile || {});
      S.prefs = Object.assign(defaults().prefs, o.prefs || {});
      save(); cardState.queue = null; render(); toast('Progress restored');
    } catch (e) { toast('That text is not a valid backup. Paste the whole text you copied.'); }
  },
  'reset-arm': function () { resetArmed = true; render(true); },
  'reset-cancel': function () { resetArmed = false; render(true); },
  'reset-confirm': function () { S = defaults(); save(); resetArmed = false; cardState.queue = null; quizState = { mid: null, i: 0, picks: [] }; go('#home'); toast('Progress reset'); }
};

var inputs = {
  words: function (t) { wordQ = t.value; wordsUpdate(); },
  'cards-filter': function (t) { cardState.filter = t.value; cardState.ahead = false; buildQueue(); render(true); },
  ask: function (t) { if (t.checked) S.asked[t.dataset.k] = true; else delete S.asked[t.dataset.k]; save(); t.closest('.check').classList.toggle('is-done', t.checked); }
};

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]');
  if (t && actions[t.dataset.act]) actions[t.dataset.act](t, e);
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.input && inputs[t.dataset.input] && t.type !== 'checkbox' && t.tagName !== 'SELECT') inputs[t.dataset.input](t);
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset && t.dataset.input && inputs[t.dataset.input] && (t.type === 'checkbox' || t.tagName === 'SELECT')) inputs[t.dataset.input](t);
  if (t.dataset && t.dataset.change === 'name') { S.profile.name = t.value.trim(); save(); toast('Saved'); }
});
document.addEventListener('keydown', function (e) {
  if (!/^#cards/.test(location.hash) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (!cardState.queue || !cardState.queue.length) return;
  if (!cardState.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); actions['card-reveal'](); }
  else if (cardState.revealed && e.key === '1') answerCard(false);
  else if (cardState.revealed && e.key === '2') answerCard(true);
});
document.getElementById('search-form').addEventListener('submit', function (e) {
  e.preventDefault(); searchQ = val('search-input'); go('#search');
});

render();
})();
</script>
<!-- build:body-end -->
</body>
