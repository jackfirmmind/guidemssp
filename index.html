<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- build:strip-above -->
<title>J2 Prep Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css">
<!-- build:head-end -->
</head>
<body>
<!-- build:body-start -->
<div class="shell">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" data-act="toggle-nav">Menu</button>
    <a class="brand" href="#home"><span class="brand-mark">FM</span><span class="brand-name">J2 Crash Course</span></a>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Course">
    <a class="brand brand-side" href="#home"><span class="brand-mark">FM</span><span class="brand-name">J2 Crash Course</span></a>
    <div class="side-progress" id="nav-progress"></div>
    <div class="nav-group">
      <a href="#home" data-nav="home">Home and plan</a>
      <a href="#course" data-nav="course">Course map</a>
      <a href="#cheatsheet" data-nav="cheatsheet">Cheat sheet</a>
      <a href="#cards" data-nav="cards">Flashcards <span class="nav-count" id="nav-due"></span></a>
      <a href="#words" data-nav="words">Word list</a>
      <a href="#scorecard" data-nav="scorecard">Practice scorecard</a>
      <a href="#questions" data-nav="questions">Day-one questions</a>
      <a href="#settings" data-nav="settings">Settings</a>
    </div>
    <form class="side-search" id="search-form" role="search">
      <label class="sr-only" for="search-input">Search the course</label>
      <input id="search-input" type="search" placeholder="Search" autocomplete="off">
    </form>
    <div class="side-size"><span class="nav-label">Text size</span><div id="side-size"></div></div>
    <p class="side-note">Personal study guide built from public information. Not affiliated with or produced by J2.</p>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script src="js/content/_core.js"></script>
<script src="js/content/course-1.js"></script>
<script src="js/content/course-2.js"></script>
<script src="js/content/course-3.js"></script>
<script src="js/content/glossary.js"></script>
<script src="js/content/extras.js"></script>
<script src="js/app.js"></script>
<!-- build:body-end -->
</body>
</html>
