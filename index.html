<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- build:strip-above -->
<title>J2 Field Manual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="css/app.css">
<!-- build:head-end -->
</head>
<body>
<!-- build:body-start -->
<div class="shell">
  <header class="topbar">
    <button class="icon-btn" id="menu-btn" type="button" aria-controls="sidebar" aria-expanded="false" data-act="toggle-nav">Menu</button>
    <a class="brand" href="#home"><span class="brand-mark">J2</span><span class="brand-name">Field Manual</span></a>
  </header>
  <nav class="sidebar" id="sidebar" aria-label="Course">
    <a class="brand brand-side" href="#home"><span class="brand-mark">J2</span><span class="brand-name">Field Manual</span></a>
    <p class="side-role">AI Automation &amp; Business Systems Engineer · pre-start crash course</p>
    <form class="side-search" id="search-form" role="search">
      <label class="sr-only" for="search-input">Search the course</label>
      <input id="search-input" type="search" placeholder="Search lessons &amp; terms" autocomplete="off">
    </form>
    <div class="nav-group">
      <span class="nav-label">Study</span>
      <a href="#home" data-nav="home">Dashboard</a>
      <a href="#modules" data-nav="modules">Curriculum</a>
      <a href="#labs" data-nav="labs">Labs</a>
      <a href="#scenarios" data-nav="scenarios">Shift scenarios</a>
      <a href="#cards" data-nav="cards">Flashcards <span class="nav-count" id="nav-due"></span></a>
      <a href="#glossary" data-nav="glossary">Glossary</a>
    </div>
    <div class="nav-group">
      <span class="nav-label">Tools</span>
      <a href="#scorecard" data-nav="scorecard">Resilience scorecard</a>
      <a href="#scorer" data-nav="scorer">Automation scorer</a>
    </div>
    <div class="nav-group">
      <span class="nav-label">Get ready</span>
      <a href="#plan" data-nav="plan">30-60-90 plan</a>
      <a href="#questions" data-nav="questions">Day-one questions</a>
      <a href="#settings" data-nav="settings">Settings &amp; backup</a>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script src="js/content/_core.js"></script>
<script src="js/content/m00-start.js"></script>
<script src="js/content/m01-company.js"></script>
<script src="js/content/m02-security.js"></script>

<script src="js/content/m06-grc.js"></script>
<script src="js/content/m07-ai.js"></script>
<script src="js/content/m08-systems.js"></script>
<script src="js/content/m09-toolkit.js"></script>
<script src="js/content/m10-first90.js"></script>
<script src="js/content/glossary.js"></script>
<script src="js/content/labs.js"></script>
<script src="js/content/scenarios.js"></script>
<script src="js/content/extras.js"></script>
<script src="js/app.js"></script>
<!-- build:body-end -->
